# CodeQL code scanning: finds security bugs (injection, unsafe data flows, path traversal...)
# in the JavaScript front end, the Rust back end and the workflows themselves. Results appear
# under Security > Code scanning and as annotations on pull requests.
name: CodeQL

# Runs where it matters: PRs into main, pushes to main, weekly (catches newly published query
# rules against unchanged code) and on demand. Day-to-day PRs into dev skip it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "29 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR/branch replaces the running scan (scheduled scans are never cancelled).
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
