# PiFiles Dedicated Native Media Player Configuration
# Hardware Direct3D11 / NVDEC
hwdec=auto-safe
vo=gpu
gpu-api=d3d11

# Modern UI (uosc takes over OSC and OSD)
osc=no
osd-bar=no
border=yes
keep-open=yes
autofit=75%x75%
cursor-autohide=1000
force-window=immediate

# Audio / Video / Subtitles
volume=80
volume-max=150
sub-auto=fuzzy
slang=en,eng
audio-file-auto=fuzzy
alang=ta,te,hi,ml,kn,en

# Seeking & Buffering
hr-seek=yes
hr-seek-framedrop=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=50MiB

