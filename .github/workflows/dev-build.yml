# Test installers (unsigned, no updater signatures; official releases come from release.yml):
#  - PRs into main: Windows installer (a required check for main);
#  - pushes to main: all three platforms, attached to the run as downloadable artifacts;
#  - any branch on demand: Actions > Dev build > Run workflow (e.g. to try a dev change).
# Day-to-day PRs into dev don't build installers.
name: Dev build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Installers (${{ matrix.platform }})
    # Dependency-bot PRs only change lockfiles: CI's compile and tests cover them; skipping the
    # installer build saves ~15-30 runner minutes each. (A skipped job counts as passed.)
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      # PRs build Windows only (fast feedback); pushes build all three platforms.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"platform":"windows-latest","args":""}]' || '[{"platform":"windows-latest","args":""},{"platform":"macos-latest","args":"--target universal-apple-darwin"},{"platform":"ubuntu-22.04","args":""}]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Fetch FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      # The prebuilt Tauri CLI from npm (package-lock.json) instead of compiling it with
      # `cargo install` on every run (several minutes on Windows).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri CLI
        run: npm ci --ignore-scripts

      - name: Build installers (no updater signing)
        shell: bash
        env:
          PIFILES_DISTRIBUTION: github
          # Test installers only: thin LTO and parallel codegen link many times faster than the
          # size-optimised release profile. Official releases (release.yml) keep full LTO.
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: npx tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PiFiles-${{ runner.os }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
