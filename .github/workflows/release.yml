# Builds PiFiles for Windows, macOS and Linux when a version tag is pushed, signs the updater
# artifacts and publishes a GitHub Release with `latest.json`, which the in-app updater reads.
#
#   git tag v0.2.0 && git push origin v0.2.0          → stable release (marked "latest")
#   git tag v0.2.0-beta.1 && git push origin v0.2.0-beta.1 → prerelease, also copied to the
#                                                       rolling "beta" release for the beta channel
#
# Required repository secrets (Settings › Secrets and variables › Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/pifiles-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty if generated without one)
# Optional (Windows code signing, removes SmartScreen warnings) — see docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Stops a release whose tag doesn't match the app version before anything is built or approved.
  verify:
    name: Tag matches the app version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the tag with tauri.conf.json, package.json and Cargo.toml
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then echo "::error::Start a release by pushing a version tag (vX.Y.Z), not from a branch."; exit 1; fi
          want="${TAG#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag $TAG | tauri.conf.json $conf | package.json $pkg | Cargo.toml $crate"
          for v in "$conf" "$pkg" "$crate"; do
            if [ "$v" != "$want" ]; then
              echo "::error::Tag $TAG doesn't match the app version (tauri.conf.json $conf, package.json $pkg, Cargo.toml $crate). Bump the version on dev, release it to main, then tag."
              exit 1
            fi
          done

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    # Signing secrets live in the protected "release" environment: a run only gets them after a
    # maintainer approves it, and only for v* tags (see docs/GITHUB-SETUP.md).
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, toolchain: stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Fetch FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      # Prebuilt Tauri CLI from package-lock.json (compiling it with cargo install takes minutes).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri CLI
        run: npm ci --ignore-scripts

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PIFILES_DISTRIBUTION: github
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: "PiFiles ${{ github.ref_name }}"
          releaseBody: "See the changelog below. Existing installs update themselves from Settings › Updates."
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true # tauri-action v1 name (was includeUpdaterJson)
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # Keeps a rolling "beta" release whose latest.json points at the newest prerelease, so the
  # Beta update channel (releases/download/beta/latest.json) always finds it.
  beta-channel:
    needs: build
    if: contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Copy latest.json to the rolling beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -R "$REPO" -p latest.json
          gh release view beta -R "$REPO" >/dev/null 2>&1 || gh release create beta -R "$REPO" --prerelease --title "Beta channel" --notes "Rolling pointer for the in-app Beta update channel. Do not delete."
          gh release upload beta latest.json -R "$REPO" --clobber

  # Opens a PR on microsoft/winget-pkgs for every stable release (after the first manual
  # submission has been merged). Needs a classic PAT with public_repo scope: WINGET_TOKEN.
  winget:
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: WINGET_TOKEN not set
        if: env.WINGET_TOKEN == ''
        run: echo "::notice::WINGET_TOKEN isn't set, so no winget update was opened. Add it (and do the first manual wingetcreate submission) to publish on winget."
      - if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: SolanumTech.PiFiles
          installers-regex: '_x64-setup\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
          # The token's owner, whose fork of microsoft/winget-pkgs the update PR comes from
          # (default would be the repository owner, the Solanum-Tech organisation).
          fork-user: SirilJoseph

  # Microsoft Store package: PiFiles built with the in-app updater off (the Store updates it),
  # packaged as an unsigned MSIX (the Store signs it) and attached to the release, ready to upload
  # in Partner Center. Skipped until the identity from Partner Center > Product identity is saved
  # as repository variables: MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER, MSSTORE_PUBLISHER_DISPLAY_NAME.
  store-package:
    name: Microsoft Store package (MSIX)
    needs: build
    if: ${{ vars.MSSTORE_PUBLISHER != '' && vars.MSSTORE_IDENTITY_NAME != '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, toolchain: stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: msstore
      - name: Fetch FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri CLI
        run: npm ci --ignore-scripts
      - name: Build PiFiles for the Store (in-app updater off)
        env:
          PIFILES_DISTRIBUTION: msstore
        run: npx tauri build --no-bundle
      - name: Package the MSIX
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          PUBLISHER_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME || 'Solanum Tech' }}
        run: ./scripts/package-msix.ps1 -Version $env:TAG -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER -PublisherDisplayName $env:PUBLISHER_NAME
      - name: Attach the MSIX to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload $env:TAG (Get-ChildItem src-tauri/target/release/msix/*.msix).FullName -R $env:REPO --clobber
