[package]
name = "pifiles"
version = "0.1.0"
description = "PiFiles — Lightweight File Explorer with NTFS fast search and media management"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pifiles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1.10"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Ioctl", "Win32_System_IO"] }
mime_guess = "2"
sysinfo = "0.32"
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
rustface = { version = "0.1.7", default-features = false }
base64 = "0.22"

[profile.release]
opt-level = "s"        # optimize for size (low-end)
lto = true             # link-time optimization for smaller binary
codegen-units = 1
panic = "abort"
strip = true           # strip symbols

[profile.dev]
incremental = true

