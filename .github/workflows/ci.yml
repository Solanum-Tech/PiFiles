# Continuous integration: runs on every pull request and every push to main/dev, plus weekly.
# Branch protection only needs to require the final "CI passed" check, which succeeds only if
# every job below succeeded (skipped jobs on push count as fine).
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: "17 4 * * 1" # weekly, so new advisories against unchanged code are still caught
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Front end checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: for f in src/*.js; do node --check "$f" || exit 1; done
      - name: No inline event handlers or javascript URLs (blocked by the CSP, and injection risks)
        run: |
          if grep -nE '\son[a-z]+="' src/*.html src/*.js; then echo "::error::Inline event handler found"; exit 1; fi
          if grep -n 'javascript:' src/*.html src/*.js; then echo "::error::javascript: URL found"; exit 1; fi
      - name: No eval / new Function
        run: |
          if grep -nE '\beval\(|new Function\(' src/*.js | grep -v fluent-icons.js; then echo "::error::eval/new Function found"; exit 1; fi
      - name: Theme and icon packs are valid JSON
        run: for f in src/packs/*; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done

  lint:
    name: Rust lints
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Clippy (correctness and suspicious lints are errors)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D clippy::correctness -D clippy::suspicious
      - name: Formatting (advisory until the codebase is formatted once)
        working-directory: src-tauri
        continue-on-error: true
        run: cargo fmt --check

  test:
    name: Unit and robustness tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --locked

  build-check:
    name: Compiles on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

  audit:
    name: Dependency vulnerabilities (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  dependency-review:
    name: Dependency review (new dependencies in this PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-3.0, SSPL-1.0
          # The licence rule protects what ships in PiFiles. winget-releaser (AGPL-3.0) is a CI
          # action that only opens the winget-pkgs PR from release.yml; it is never built into or
          # distributed with the app, so its licence doesn't reach PiFiles.
          allow-dependencies-licenses: >-
            pkg:githubactions/vedantmgoyal9/winget-releaser,
            pkg:githubactions/vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e
          # Accepted advisories (each one reviewed; remove it once the cause is gone):
          #  GHSA-wrw7-89jp-8q8g / RUSTSEC-2024-0429 - unsound glib::VariantStrIter in glib 0.18.
          #    Linux only, pulled in by Tauri itself (gtk/webkit2gtk 0.18); PiFiles never calls glib.
          #    The fix is glib >= 0.20, which needs Tauri to move to gtk-rs >= 0.20.
          allow-ghsas: GHSA-wrw7-89jp-8q8g

  ci-passed:
    name: CI passed
    if: always()
    needs: [frontend, lint, test, build-check, audit, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
