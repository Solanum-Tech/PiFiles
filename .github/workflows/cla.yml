# Contributor License Agreement: every outside contributor signs once by commenting on their
# pull request. Signatures are stored in this repository (branch "cla-signatures"); no external
# service is involved. This workflow never checks out or runs code from the pull request.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # stores signatures on the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Bots (Dependabot, GitHub Actions) never sign; skip them entirely.
    if: >-
      !endsWith(github.actor, '[bot]') && (
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Solanum-Tech/PiFiles/blob/main/.github/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # Maintainers and bots don't need to sign.
          allowlist: SirilJoseph,dependabot[bot],github-actions[bot]
