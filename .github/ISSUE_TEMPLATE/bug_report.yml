name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open folder ...\n2. Right-click ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PiFiles version (Settings › About)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2 / macOS 15 / Ubuntu 24.04
  - type: markdown
    attributes:
      value: "Security problem? Please report it privately instead: Security › Report a vulnerability."
